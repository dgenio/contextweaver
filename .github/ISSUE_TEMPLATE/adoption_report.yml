name: Adoption / evaluation report
description: Share a genuine ContextWeaver evaluation or integration without turning stars/forks into adoption claims.
title: "[Adoption evidence] "
labels:
  - adoption
  - product
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing evidence. A successful demo is useful, but this form deliberately distinguishes evaluation, real integration, retained use, and former use. Do not include credentials, proprietary schemas, prompts, customer data, or other information you cannot publish.

  - type: dropdown
    id: status
    attributes:
      label: Current status
      description: Choose the strongest state that is already true today.
      options:
        - Evaluating with real or representative sources
        - Integrated in a genuine project/workflow
        - Retained integration (active for about 30 days or more)
        - Former evaluation/integration (removed or abandoned)
    validations:
      required: true

  - type: input
    id: identity
    attributes:
      label: Project / organization
      description: A public project/org name, or write "anonymous".
      placeholder: anonymous
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem you were trying to solve
      description: Describe the pre-existing workflow/pain before talking about ContextWeaver.
      placeholder: How did you manage/version/evaluate capability or context surfaces before this trial?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Simpler alternatives considered or used
      description: Provider-native tool search, an MCP gateway, ordinary config/version control, simple retrieval, framework-native tooling, etc.
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: What ContextWeaver surface did you actually use?
      description: Real/representative sources, compile/analyse/eval/diff, routing, context firewall, gateway compatibility path, etc. Keep proprietary details generalized.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Observable result and trade-offs
      description: What improved, failed, remained unclear, or added ceremony/operational cost? Negative results are welcome.
    validations:
      required: true

  - type: textarea
    id: blocker
    attributes:
      label: Biggest blocker or reason you might remove it
      description: If none, say none. This is often more useful than praise.
    validations:
      required: true

  - type: dropdown
    id: assistance
    attributes:
      label: Maintainer assistance before first meaningful success
      options:
        - None — unassisted
        - Asynchronous docs/issues only
        - Synchronous maintainer help
    validations:
      required: true

  - type: checkboxes
    id: permissions
    attributes:
      label: Optional permissions
      options:
        - label: I permit this issue itself to be used as public evidence.
        - label: I permit the maintainer to add my named project/organization to ADOPTERS.md.
        - label: I am willing to receive a follow-up around 7 and/or 30 days about whether the integration is still active.

  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I have not included credentials, customer data, proprietary tool schemas/prompts, or information I am not allowed to publish.
          required: true
