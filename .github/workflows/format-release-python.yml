name: One-shot release Python formatting repair

on:
  push:
    branches: ["release/v0.18.1"]
    paths: [".release-format-repair"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: release/v0.18.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install repository formatter
        run: python -m pip install -e ".[dev]"

      - name: Apply the exact Ruff formatter used by CI
        run: |
          ruff format \
            scripts/baseline_naive.py \
            scripts/check_release_readiness.py \
            scripts/prepare_release.py \
            scripts/render_trend.py \
            tests/test_baseline_naive.py \
            tests/test_check_release_readiness.py \
            tests/test_render_trend.py
          ruff format --check \
            scripts/baseline_naive.py \
            scripts/check_release_readiness.py \
            scripts/prepare_release.py \
            scripts/render_trend.py \
            tests/test_baseline_naive.py \
            tests/test_check_release_readiness.py \
            tests/test_render_trend.py

      - name: Remove one-shot workflow and trigger
        run: rm .github/workflows/format-release-python.yml .release-format-repair

      - name: Commit formatting-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff format to release tooling"
          git push origin HEAD:release/v0.18.1
