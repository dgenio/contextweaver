name: Publish to PyPI and MCP Registry

# High-trust release workflow. Actions are pinned to immutable commit SHAs and
# package publication uses OIDC Trusted Publishing. It may start from a human
# GitHub Release or from an explicit workflow_dispatch on the immutable release
# tag. The latter is used by create-release.yml because GitHub intentionally
# suppresses ordinary workflow events caused by GITHUB_TOKEN-created releases.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        # workflow_dispatch must be invoked with ref=vX.Y.Z. For both supported
        # triggers GITHUB_REF_NAME is therefore the immutable release tag.
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(python scripts/check_readme_version.py --print-version)"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release ref '$tag' does not match package version 'v$version'." >&2
            echo "Dispatch this workflow on the immutable vX.Y.Z tag, never on a branch." >&2
            exit 1
          fi
          echo "Release ref '$tag' matches package version 'v$version'."

      - name: Verify version metadata is in sync
        run: python scripts/check_version_metadata.py

      - name: Verify release evidence is complete
        # Validates current snapshot schema/method metadata and trend freshness,
        # not just file existence (#837, #841).
        run: python scripts/check_release_readiness.py

      - name: Install package and test/build tooling
        run: pip install -e ".[dev]" build twine

      - name: Pre-publish test suite (gating)
        run: pytest -q

      - name: Build and check distribution metadata
        run: |
          python -m build
          twine check dist/*

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Sync server.json version from pyproject
        run: python scripts/check_version_metadata.py --sync

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json (retry while PyPI metadata propagates)
        run: |
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish; then
              echo "Published to the MCP Registry."
              exit 0
            fi
            echo "Attempt $attempt failed (PyPI metadata may still be propagating); retrying in 30s..."
            sleep 30
          done
          echo "::error::mcp-publisher publish failed after 6 attempts." >&2
          exit 1
