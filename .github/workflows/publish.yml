name: Publish to PyPI and MCP Registry

# High-trust release workflow. Actions are pinned to immutable commit SHAs and
# package publication uses OIDC Trusted Publishing. It may start from a human
# GitHub Release or from an explicit workflow_dispatch on the immutable release
# tag. The latter is used by create-release.yml because GitHub intentionally
# suppresses ordinary workflow events caused by GITHUB_TOKEN-created releases.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Reviewed from the official modelcontextprotocol/registry v1.7.9 release.
  # Updating either value must produce a repository diff and be reviewed.
  MCP_PUBLISHER_VERSION: v1.7.9
  MCP_PUBLISHER_LINUX_AMD64_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac

jobs:
  verify:
    name: Verify release integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        # workflow_dispatch must be invoked with ref=vX.Y.Z. For both supported
        # triggers GITHUB_REF_NAME is therefore the immutable release tag.
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release ref '$tag' is not an immutable vX.Y.Z tag." >&2
            echo "Dispatch this workflow on a vX.Y.Z tag only, never on a branch." >&2
            exit 1
          fi
          version="$(python scripts/check_readme_version.py --print-version)"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release ref '$tag' does not match package version 'v$version'." >&2
            echo "Dispatch this workflow on the immutable vX.Y.Z tag, never on a branch." >&2
            exit 1
          fi
          echo "Release ref '$tag' matches package version 'v$version'."

      - name: Verify version metadata is in sync
        run: python scripts/check_version_metadata.py

      - name: Verify release evidence is complete
        # Validates current snapshot schema/method metadata and trend freshness,
        # not just file existence (#837, #841).
        run: python scripts/check_release_readiness.py

      - name: Install package and test/build tooling
        # The gating benchmark matrix exercises BM25 as an available backend;
        # install that optional extra explicitly instead of making the result
        # depend on runner state.
        run: pip install -e ".[dev,bm25]" build twine

      - name: Pre-publish test suite (gating)
        run: pytest -q

      - name: Build and check distribution metadata
        run: |
          python -m build
          twine check dist/*

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Sync server.json version from pyproject
        run: python scripts/check_version_metadata.py --sync

      - name: Install verified mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          asset="mcp-publisher_linux_amd64.tar.gz"
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${asset}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$asset" "$url"
          printf '%s  %s\n' "$MCP_PUBLISHER_LINUX_AMD64_SHA256" "$asset" | sha256sum --check --strict
          tar xzf "$asset" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json (retry while PyPI metadata propagates)
        run: |
          for attempt in 1 2 3 4 5 6; do
            set +e
            err_msg=$(./mcp-publisher publish 2>&1)
            exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              echo "Published to the MCP Registry."
              exit 0
            fi
            printf '%s\n' "$err_msg"
            if printf '%s\n' "$err_msg" | grep -Fqi 'cannot publish duplicate version'; then
              echo "Version already present in the MCP Registry; treating as success."
              exit 0
            fi
            echo "Attempt $attempt failed (exit code $exit_code; PyPI metadata may still be propagating); retrying in 30s..."
            sleep 30
          done
          echo "::error::mcp-publisher publish failed after 6 attempts." >&2
          exit 1
