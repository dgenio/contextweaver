name: Prepare release branch

on:
  push:
    branches:
      - "release/**"
    paths:
      - ".release-target.json"
      - ".release-repair"

permissions:
  contents: write

# Release evidence is generated before a tag/GitHub Release exists. The
# benchmark runs into /tmp; benchmarks/results/latest.json is only borrowed
# temporarily for the legacy preparation helper and is restored exactly from
# origin/main before the release commit. This prevents release bookkeeping from
# silently replacing the canonical benchmark artifact (#841).
jobs:
  prepare:
    name: Prepare release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Generate isolated deterministic benchmark evidence
        run: python benchmarks/benchmark.py --output /tmp/contextweaver-release-benchmark.json

      - name: Prepare or repair release artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .release-target.json ]]; then
            # prepare_release.py still reads latest.json. Feed it the isolated
            # result temporarily, then restore the canonical artifact below.
            cp /tmp/contextweaver-release-benchmark.json benchmarks/results/latest.json
            python scripts/prepare_release.py --target-file .release-target.json
          elif [[ -f .release-repair ]]; then
            version="$(python scripts/check_readme_version.py --print-version)"
            python scripts/render_trend.py --snapshot "$version" \
              --from /tmp/contextweaver-release-benchmark.json
            python scripts/render_trend.py
            python scripts/gen_llms.py
            rm .release-repair
          else
            echo "No release preparation trigger found; nothing to do."
            exit 0
          fi

      - name: Restore canonical benchmark artifact and validate
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- benchmarks/results/latest.json
          python scripts/check_readme_version.py
          python scripts/check_security_policy.py
          python scripts/check_version_metadata.py
          python scripts/check_release_readiness.py
          python scripts/render_trend.py --check
          python scripts/gen_llms.py --check

      - name: Commit prepared release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release preparation produced no changes."
            exit 0
          fi
          version="$(python scripts/check_readme_version.py --print-version)"
          git commit -m "release: prepare v${version}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
