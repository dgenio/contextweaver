name: D1 evidence formatter

on:
  push:
    branches:
      - product/d1-distribution-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: product/d1-distribution-evidence
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install repository Ruff version
        run: pip install ruff==0.16.3
      - name: Format evidence code
        run: ruff format scripts/onboarding_report.py tests/test_onboarding_report.py
      - name: Commit formatter output when changed
        run: |
          set -euo pipefail
          git add scripts/onboarding_report.py tests/test_onboarding_report.py
          if git diff --cached --quiet; then
            echo "Evidence files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format D1 evidence code"
          git push origin HEAD:product/d1-distribution-evidence
