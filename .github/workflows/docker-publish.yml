# Build and publish the official multi-arch gateway image to GHCR (issue #432).
#
# Triggers on published releases (same policy as publish.yml) and manual
# dispatch for pre-release smoke builds. Pushes:
#   ghcr.io/dgenio/contextweaver:<version>  +  :latest  (releases only)
#
# Every Action is pinned to an immutable commit SHA. The Docker Actions are
# upgraded as one coordinated set because their current major releases share
# the Node 24 runtime/toolkit generation; Dependabot groups future docker/*
# updates so this workflow gets one coherent review instead of five PRs.

name: docker-publish

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=contextweaver MCP gateway
            org.opencontainers.image.description=MCP gateway: bounded tool shortlists + artifact-backed result firewall. Deterministic, no model.
            org.opencontainers.image.licenses=MIT
            io.modelcontextprotocol.server.name=io.github.dgenio/contextweaver

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
