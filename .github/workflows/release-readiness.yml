name: Release readiness

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a release that never reached PyPI is noticed in days rather
    # than the six weeks 0.17.0 went unnoticed.
    - cron: "40 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# This check exists because v0.18.0 reached GitHub Releases without the
# version-specific deterministic benchmark snapshot required by publish.yml.
# The publish workflow correctly failed, but by then PyPI had already diverged
# from the public GitHub release. Run the invariant during normal PR/main CI so
# release artifacts are complete before anyone presses "Publish release".
jobs:
  release-readiness:
    name: Release artifacts ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify current package version is release-ready
        run: python scripts/check_release_readiness.py

  published-versions:
    name: Released tags match PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On pull_request this reads pypi.org only when the PR touches the check
    # itself. Both halves have a reason: a PyPI outage must not redden an
    # unrelated contributor's PR, but skipping pull_request outright meant this
    # job's first ever execution was on main — where it went red on eleven
    # historical gaps that its author's partial checkout had hidden. A PR that
    # edits this check is exactly the PR that should carry the outage risk.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Without tags the script reconciles an empty set and passes
          # vacuously; it errors on an empty tag list for exactly this reason.
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Does this run need to read PyPI?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qxE \
            'scripts/check_published_versions\.py|release/unpublished_versions\.json|\.github/workflows/release-readiness\.yml'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "This PR does not touch the published-versions check; PyPI not read." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reconcile released tags against PyPI
        if: steps.scope.outputs.needed == 'true'
        run: python scripts/check_published_versions.py
