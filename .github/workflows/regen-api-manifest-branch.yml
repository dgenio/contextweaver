name: Regenerate API manifest on fix branch

on:
  push:
    branches:
      - fix/release-manifest-environment-independence

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/release-manifest-environment-independence

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install focused test environment
        run: pip install -e ".[dev,bm25]"

      - name: Validate generator before regeneration
        run: pytest -q tests/test_gen_api_manifest.py -k "not check_passes_against_committed_manifest"

      - name: Regenerate and validate manifest
        run: |
          python scripts/gen_api_manifest.py
          pytest -q tests/test_gen_api_manifest.py

      - name: Commit generated manifest
        run: |
          if git diff --quiet -- api/public_api.txt; then
            echo "Manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/public_api.txt
          git commit -m "chore: regenerate public API manifest"
          git push
