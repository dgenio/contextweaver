name: PR853 finalize generated docs

on:
  push:
    branches:
      - refactor/invariants-module-size-752-753

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refactor/invariants-module-size-752-753
          fetch-depth: 0

      - name: Reconcile canonical agent guide
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AGENTS.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          out = []
          seen = {
              "scoring_row": 0,
              "consolidation_row": 0,
              "config_row": 0,
              "loop_row": 0,
              "json_io_row": 0,
              "manager_mixins": 0,
              "ingest_row": 0,
          }

          for line in lines:
              if line.startswith("| `_scoring_config.py` |"):
                  seen["scoring_row"] += 1
                  continue
              if line.startswith("| `context/_consolidation_helpers.py` |"):
                  seen["consolidation_row"] += 1
                  continue
              if line.startswith("| `config.py` |"):
                  seen["config_row"] += 1
                  line = line.replace("and re-exported `ScoringConfig`", "and `ScoringConfig`")
              if line.startswith("| `store/_loop_thread.py` |"):
                  seen["loop_row"] += 1
                  line = line.replace(
                      "(extracted to keep that module ≤300 lines)",
                      "(kept separate to isolate loop lifecycle and timeout handling)",
                  )
              if line.startswith("| `store/_json_file_io.py` |"):
                  seen["json_io_row"] += 1
                  line = line.replace(
                      "(keeps it ≤300 lines)",
                      "(keeps filesystem concerns isolated from store policy)",
                  )
              if line.startswith("| `context/_manager_ingest.py` / `_manager_build.py` / `_manager_routing.py` |"):
                  seen["manager_mixins"] += 1
                  line = (
                      "| `context/_manager_ingest.py` / `_manager_build.py` / `_manager_routing.py` | "
                      "Private partial-class mixins that preserve `ContextManager`'s public ingestion, build, "
                      "and route/call-prompt API while delegating implementation to focused modules. "
                      "Their composition is private implementation detail; the public behavior/API is the contract. |"
                  )
              if line.startswith("| `context/ingest.py` |"):
                  seen["ingest_row"] += 1
                  line = line.replace(
                      "Tool-result ingestion helpers (extracted from `manager.py` to honor the <=300 line guideline).",
                      "Tool-result ingestion helpers kept separate from the public manager façade to isolate ingestion concerns.",
                  )
              out.append(line)

          expected_once = {k: v for k, v in seen.items() if v != 1}
          if expected_once:
              raise SystemExit(f"expected exactly one canonical row for each edit, got: {expected_once}")

          text = "\n".join(out) + "\n"
          stale_tokens = ("≤300", "<=300", "300-line", "300 line")
          stale_lines = [line for line in text.splitlines() if any(tok in line for tok in stale_tokens)]
          if stale_lines:
              raise SystemExit("stale 300-line guidance remains in AGENTS.md:\n" + "\n".join(stale_lines))
          if "_scoring_config.py" in text or "_consolidation_helpers.py" in text:
              raise SystemExit("removed mechanical helper module still referenced in AGENTS.md")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate canonical LLM documentation bundle
        run: python scripts/gen_llms.py

      - name: Sanity checks
        run: |
          git diff --check
          test -s llms-full.txt
          ! grep -Eq '≤300|<=300|300-line|300 line' AGENTS.md
          ! grep -q '_scoring_config.py' AGENTS.md
          ! grep -q '_consolidation_helpers.py' AGENTS.md

      - name: Commit canonical generated state and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md llms-full.txt
          git rm .github/workflows/pr853-finalize-generated.yml
          git commit -m "docs: reconcile canonical agent guidance and generated bundle"
          git push origin HEAD:refactor/invariants-module-size-752-753
