name: D1 README generated artifact refresh

on:
  push:
    branches:
      - docs/d1-first-readme

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: docs/d1-first-readme
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Regenerate deterministic LLM documentation artifacts
        run: python scripts/gen_llms.py
      - name: Commit generated artifacts when changed
        run: |
          set -euo pipefail
          git add llms.txt llms-full.txt
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate llms artifact for D1 README"
          git push origin HEAD:docs/d1-first-readme
