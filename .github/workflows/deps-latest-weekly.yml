name: Weekly Latest / Pre-release Deps

# The safety net that justifies shipping no upper-bound caps (issue #356).
# A normal CI run resolves the latest *stable* deps; this job goes further and
# installs the newest releases *including pre-releases* on the newest supported
# Python, then runs the suite. It is non-gating — it runs only on a schedule and
# is not a required status check, so a failure blocks no development. A red run
# is the point: it is the early warning that an upstream release (or a
# pre-release) breaks contextweaver, and tells us when a deliberately retained
# cap (e.g. the pre-1.0 ``weaver_contracts<1``) is safe to move. See pyproject.toml's
# dependency-constraint policy comment and CONTRIBUTING.md.
# Actions are pinned to immutable commit SHAs; Dependabot maintains the pins.

on:
  schedule:
    # Tuesday 06:00 UTC. Off-hours; staggered a day after the weekly scorecard
    # job (Monday) to keep runner contention low.
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-prerelease:
    name: Latest + pre-release deps (3.14)
    runs-on: ubuntu-latest
    # Non-gating by construction: scheduled-only and not a required status
    # check, so a failure blocks no PR or merge. The run is allowed to go red on
    # purpose — that red is the early-warning signal (it fires the usual Actions
    # failure notification); a job-level continue-on-error would only hide it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install newest deps (incl. pre-releases)
        # Keep this to the 3.14-resolvable dev surface. The heavier adapter tree
        # remains exercised separately on 3.13 below until its upstreams publish
        # compatible 3.14 distributions.
        run: uv pip install --system --prerelease allow --upgrade -e ".[dev]"

      - name: Test (latest / pre-release versions)
        run: pytest -q

  ci-dark-extras:
    # CI-dark optional-dependency coverage (issue #751). CI normally installs
    # only [dev,dev-adapters,langchain,bm25], so tests behind the remaining
    # framework/backend extras (agno, smolagents, pydantic-ai, openai-agents,
    # google-adk, agent-framework, zep, embeddings) silently skip on every run —
    # roughly half the advertised integration surface with no evidence of
    # working. This non-gating job installs them all and runs the suite with
    # --strict-live, so an optional-dependency skip (a broken install or import)
    # becomes a failure instead of a silent pass. Non-gating by construction
    # (scheduled-only, not a required check): a red run is the early-warning
    # signal, exactly like the latest-prerelease job above.
    name: CI-dark extras (live tests, 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies incl. the CI-dark extras
        # Best-effort resolution of the full optional surface; these upstreams
        # churn fast and can conflict, which is itself signal worth seeing.
        run: |
          pip install -e ".[dev,dev-adapters,langchain,bm25,retrieval,agno,smolagents,pydantic-ai,openai-agents,google-adk,agent-framework,zep,embeddings]"

      - name: Test (all extras installed, strict-live)
        # --strict-live turns any remaining optional-dependency skip into a
        # failure; the skip-report line surfaces the total skip count (#751).
        run: pytest -q --strict-live
