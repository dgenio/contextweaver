name: One-shot v0.18.1 changelog repair

on:
  push:
    branches: ["release/v0.18.1"]
    paths: [".release-changelog-repair"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: release/v0.18.1

      - name: Record evidence-integrity repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          fixed_anchor = "- Blocked Dependabot from widening the supported MCP SDK range into the breaking 2.x line until an explicit compatibility migration is completed.\n"
          fixed_new = fixed_anchor + (
              "- Fixed the naive-vs-ContextWeaver benchmark ratio so both arms use the same explicit `heuristic/chardiv4` estimated-token method; release snapshot schema v2 now records the measurement method and marks 0.16–0.18 token-reduction history as legacy/unverified methodology rather than a directly comparable trend (#841).\n"
          )
          changed_anchor = "- Added deterministic release preparation/readiness tooling and documented the immutable recovery path for failed package publication.\n"
          changed_new = (
              "- Added deterministic release preparation/readiness tooling, isolated release benchmark generation, immutable tag/release creation, and an explicit Trusted Publishing dispatch so package publication is validated before and after the release hand-off.\n"
              "- Reframed the README around reproducible capability/context control, removed the unqualified `43–85% fewer prompt tokens` hero claim, and added a claim registry that distinguishes proven, fixture-bound, unverified, and rejected claims (#397, #758, #841).\n"
          )
          for old, new in ((fixed_anchor, fixed_new), (changed_anchor, changed_new)):
              if text.count(old) != 1:
                  raise SystemExit(f"expected one changelog anchor, found {text.count(old)}: {old[:60]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot workflow and trigger
        run: rm .github/workflows/repair-release-changelog.yml .release-changelog-repair

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record v0.18.1 evidence-integrity repair"
          git push origin HEAD:release/v0.18.1
