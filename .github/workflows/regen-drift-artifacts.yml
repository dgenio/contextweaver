name: regenerate-drift-artifacts

on:
  push:
    branches:
      - "agent/dependabot-policy-hardening"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,dev-adapters,langchain,bm25]"
      - name: Regenerate stale artifacts
        run: |
          make llms
          make api
      - name: Commit generated files to the maintenance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms-full.txt api/public_api.txt
          if git diff --cached --quiet; then
            echo "Generated artifacts were already current."
          else
            git commit -m "chore(release): refresh generated artifacts for 0.18"
            git push origin HEAD:agent/dependabot-policy-hardening
          fi
      - name: Upload generated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drift-repair
          path: |
            llms-full.txt
            api/public_api.txt
          if-no-files-found: error
          retention-days: 1
